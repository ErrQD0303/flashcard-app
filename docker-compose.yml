services:
  db:
    image: postgres:17-alpine
    container_name: flash_card_app_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin@123!
      POSTGRES_DB: flashcard-app
    ports:
      - "5443:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d flashcard-app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: flashcard_app_postgres_data
    labels:
      com.example.description: "PostgreSQL persistent storage"
      com.example.version: "1.0"
      com.example.author: "Dat Nguyen"
      com.example.app: "FlashCardApp"
      com.example.environment: "Development"